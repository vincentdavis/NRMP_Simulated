name: CI

on:
  push:
    branches: [main, production]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and Django checks
    runs-on: ubuntu-latest
    env:
      # Production settings for the checks: DEBUG off, throwaway secret, SQLite, Logfire silent.
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGH
      DATABASE_URL: sqlite:///ci.sqlite3
      LOGFIRE_SEND_TO_LOGFIRE: "false"
      # Django 6.1's deploy check (mail.E001) requires a real email backend; production needs one for password
      # reset and confirmation links. Nothing is sent from CI.
      EMAIL_HOST: smtp.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: codespell
        run: uv run codespell .
      - name: mypy
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      # As in the Docker build: the manifest storage hashes every static file (and fails on a missing source map),
      # and the help checks render guide pages whose links need the manifest.
      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput
      - name: Deploy checks
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: ty (informational)
        run: uv run ty check nrmps
        continue-on-error: true

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: pytest
        env:
          NRMP_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
        run: uv run pytest
      - name: Validation report (stability, rural hospitals, oracle, strategy-proofness on random markets)
        if: matrix.database == 'sqlite'
        env:
          DJANGO_SETTINGS_MODULE: NRMP_Simulated.settings_test
        run: uv run python manage.py nrmp_validate --markets 500 --misreport-markets 100

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t nrmp-simulated:ci .
      - name: The image migrates, starts and passes its health check
        run: |
          docker run -d --name app -p 8000:8000 \
            -e SECRET_KEY=ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 -e LOGFIRE_SEND_TO_LOGFIRE=false \
            -e ALLOWED_HOSTS=localhost -e SECURE_SSL_REDIRECT=False -e MIGRATE_ON_START=1 \
            nrmp-simulated:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              curl -fsS -o /dev/null http://localhost:8000/ && exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  browser:
    name: Browser tests (Playwright + axe) and CSS classes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked
      - name: Build the CSS
        run: cd theme/static_src && npm ci --no-audit --no-fund && npm run build
      - name: Every template class exists in the built CSS
        env:
          NRMP_REQUIRE_BUILT_CSS: "1"
        run: uv run pytest nrmps/tests/test_css_classes.py
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Pages fit 390 px and have no serious axe violations
        run: uv run pytest -m e2e
