{% comment %}Error from the last action, shown in the card of the stage it belongs to (`stage`).{% endcomment %}
{% if error and error_stage == stage %}
  <div role="alert" class="alert alert-error mb-3">
    <div>
      <p>{{ error }}</p>
      {% if error_details %}
        <ul class="list-disc ml-5 mt-1 text-sm">
          {% for detail in error_details %}<li>{{ detail }}</li>{% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
{% endif %}
