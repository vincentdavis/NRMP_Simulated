{% extends "base.html" %}
{% load form_tags %}
{% block title %}Edit account - NRMP Simulations{% endblock %}
{% block content %}
<div class="py-4 max-w-md">
  <h1 class="text-2xl font-bold mb-4">Edit account</h1>
  <form method="post" class="card bg-base-100 shadow-xl" novalidate>
    {% csrf_token %}
    <div class="card-body">
      {% field_row form.full_name %}
      {% field_row form.email %}
      <div class="card-actions justify-end mt-2">
        <a class="btn btn-outline" href="{% url 'nrmps:account' %}">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
