# Install once with `uvx pre-commit install`; run on everything with `uvx pre-commit run --all-files`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^static/vendor/  # vendored browser libraries (ECharts is 1.1 MB), committed on purpose
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: django-migrations
        name: Django migrations are up to date
        entry: env DJANGO_SETTINGS_MODULE=NRMP_Simulated.settings_test uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: ^nrmps/(models\.py|migrations/)
