# Ruff configuration. The Python version comes from requires-python in pyproject.toml.
line-length = 120
# Generated migrations are not hand-edited; docs/ holds the review as written (its prototypes have their own config).
extend-exclude = ["nrmps/migrations", "docs"]

[lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (Google convention, below)
    "DJ",   # flake8-django
    "DTZ",  # flake8-datetimez: no naive datetimes
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "FLY",  # flynt
    "I",    # isort
    "NPY",  # NumPy-specific rules
    "PERF", # Perflint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D100",   # module docstrings are optional
    "D104",   # package docstrings are optional
    "D105",   # magic methods (__str__) need no docstring
    "D106",   # nested Meta classes need no docstring
    "D107",   # __init__ is documented on the class
    "RUF012", # Django's Meta/widgets class attributes are mutable by design
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests: assert, test passwords and subprocesses are fine; docstrings are optional.
"**/tests/**" = ["S101", "S105", "S106", "S603", "D"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Format code examples in docstrings.
docstring-code-format = true
docstring-code-line-length = "dynamic"
