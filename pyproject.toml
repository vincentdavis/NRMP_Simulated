[project]
name = "nrmp-simulated"
version = "0.1.0"
description = "Simulate the residency Match: applicants, programs, preferences, interviews and rankings."
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-axes>=8.3.1",
    "django-htmx>=1.29.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind>=4.5.0",
    "logfire[django]>=5.1.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
prod = [
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]
dev = [
    "axe-playwright-python>=0.1.8",
    "codespell>=2.4.3",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "django-reset-migrations>=0.4.0",
    "django-stubs[compatible-mypy]>=6.1.1",
    "django-tailwind[cookiecutter,honcho,reload]>=4.5.0",
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "NRMP_Simulated.settings_test"
python_files = ["test_*.py"]
testpaths = ["nrmps"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser tests with Playwright (run with `pytest -m e2e`)"]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT does not exist until collectstatic has run.
    "ignore:No directory at:UserWarning",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "^docs/"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "NRMP_Simulated.settings_test"

[[tool.mypy.overrides]]
module = ["scipy.*", "axes.*", "debug_toolbar.*", "django_browser_reload.*", "hypothesis.*", "axe_playwright_python.*"]
ignore_missing_imports = true

[tool.uv]
# Local development and CI get the production database driver and server too, so tests can run on PostgreSQL.
# The Docker image installs `--no-dev --group prod`.
default-groups = ["dev", "prod"]

[tool.codespell]
# Vendored, minified or generated files, binaries and local caches.
skip = "*.lock,package-lock.json,./static/vendor,./theme/static,./theme/static_src/node_modules,./staticfiles,./.venv,./.git,*.png,*.jpg,*.sqlite3,*.sqlite,./.ruff_cache,./.pytest_cache,./.mypy_cache,./.hypothesis,./.idea"
# AER: American Economic Review (a citation in the review).
ignore-words-list = "aer"
