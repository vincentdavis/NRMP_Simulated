[project]
name = "nrmp-simulated"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-htmx>=1.29.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind>=4.5.0",
    "logfire[django]>=5.1.1",
    "scipy>=1.18.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
prod = [
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]
dev = [
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "django-reset-migrations>=0.4.0",
    "django-stubs>=6.1.1",
    "django-tailwind[cookiecutter,honcho,reload]>=4.5.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "NRMP_Simulated.settings_test"
python_files = ["test_*.py"]
testpaths = ["nrmps"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT does not exist until collectstatic has run.
    "ignore:No directory at:UserWarning",
]
