<!doctype html>
<!--
  The link preview image (Open Graph), 1200 x 630: static/img/social-card.png, named by nrmps/seo.py.
  To render it again after a change, from the repository root:

    uv run python docs/assets/render_images.py

  The grid on the right is the "who matched where" chart of an idealized market: applicants by strength (rows)
  against the quality of the program they matched to (columns), in the charts' blue ramp.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f8f9fb; color: #1b2330; display: flex; gap: 56px; align-items: center;
  }
  .text { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; color: #1f63b8; }
  .brand img { width: 64px; height: 64px; }
  h1 { font-size: 68px; line-height: 1.06; margin: 36px 0 24px; letter-spacing: -0.02em; }
  p { font-size: 30px; line-height: 1.35; margin: 0; color: #3d4757; }
  .note { margin-top: 36px; font-size: 21px; color: #5b6676; }
  .grid { display: grid; grid-template-columns: repeat(5, 76px); gap: 6px; }
  .grid i { display: block; width: 76px; height: 76px; border-radius: 8px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../static/NRMP_Simulations_logo.png" alt="">NRMP Simulations</div>
    <h1>Simulate the residency Match</h1>
    <p>Applications, preference signals, interviews, rank order lists and the match. Open source, for research, teaching and program strategy.</p>
    <div class="note">An independent simulator, not affiliated with the NRMP.</div>
  </div>
  <div class="grid" aria-hidden="true">
    <!-- rows from the strongest applicants (top) to the weakest; shares of each row, 0 to 1 -->
    <script>
      const rows = [[0, 0, 0, 0.24, 0.72], [0, 0, 0.22, 0.53, 0.24], [0, 0.56, 0.32, 0.04, 0], [0.74, 0.21, 0, 0, 0], [0.15, 0, 0, 0, 0]];
      const stops = [[0, [232, 240, 251]], [0.5, [79, 147, 226]], [0.75, [31, 99, 184]], [1, [13, 54, 107]]];
      const colour = (v) => {
        const k = Math.max(1, stops.findIndex(([at]) => at >= v));
        const [a, x] = stops[k - 1], [b, y] = stops[k];
        const w = (v - a) / (b - a);
        return `rgb(${x.map((c, i) => Math.round(c + (y[i] - c) * w)).join(",")})`;
      };
      document.currentScript.parentElement.append(...rows.flat().map((v) => {
        const cell = document.createElement("i");
        cell.style.background = colour(v);
        return cell;
      }));
    </script>
  </div>
</body>
</html>
